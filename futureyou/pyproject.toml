[project]
name = "futureyou"
version = "0.1.0"
description = "FutureYou API"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.1",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "scipy>=1.11.0",
    "shap>=0.41.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app",
    "email_service",
    "predictor",
    "sentinel",
    "train_models",
    "utils",
    "verify_setup",
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"
