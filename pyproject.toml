[project]
name = "futureyou"
version = "0.1.0"
description = "FutureYou API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "joblib==1.4.2",
    "scipy==1.13.1",
]

[tool.vercel]
entrypoint = "api:app"
runtime = "python3.12"
